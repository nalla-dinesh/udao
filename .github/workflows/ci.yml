name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze (strict — zero issues expected)
        run: flutter analyze

      - name: Format check
        run: dart format --set-exit-if-changed lib test

      - name: Unit + widget tests
        run: flutter test

      - name: Ban default icon classes (brand icons only)
        run: |
          if grep -rEn "\b(Icons|CupertinoIcons)\." lib/; then
            echo "::error::Material/Cupertino icon classes are banned in lib/ — use AppIcons or phosphor_flutter"
            exit 1
          fi

      - name: Permission audit (no INTERNET outside dev overlays)
        run: bash tools/bootstrap.sh

      - name: Debug smoke build (play flavor)
        run: flutter build apk --debug --flavor play
